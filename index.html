let ep=0,idx=0,mode='story',auto=null,battleStep=0;const logs=[],$=id=>document.getElementById(id);
function fit(){document.documentElement.style.setProperty('--fit',Math.min(innerWidth/1600,innerHeight/740))}
function hideAll(){['story','choice','mission','battle','result'].forEach(x=>$(x).classList.remove('show'));$('mireille').classList.remove('show');$('elise').classList.remove('show')}
function setBg(src){$('bg').style.backgroundImage=`url('${A+src}')`}
function setHeader(){const e=episodes[ep];$('epNo').textContent=`EP ${String(e.n).padStart(2,'0')} / 05`;$('epName').textContent=e.title;$('type').textContent=`${e.type} · ${e.label}`;document.querySelectorAll('#episodeMap button').forEach((b,k)=>{b.classList.toggle('on',k===ep);b.classList.toggle('done',k<ep)})}
function showActor(a){$('mireille').classList.toggle('show',a==='mireille');$('elise').classList.toggle('show',a==='elise')}
function say(s){hideAll();mode='story';$('story').classList.add('show');showActor(s.actor||'');$('speaker').textContent=s.who||'기록';$('speakerEn').textContent=s.en||'';$('direction').textContent=s.dir||'';$('dialogue').textContent=s.text;logs.push({who:s.who||'기록',text:s.text});}
function showChoice(s){hideAll();mode='choice';$('choice').innerHTML='';s.options.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{logs.push({who:'선택',text:t});idx++;render()};$('choice').appendChild(b)});$('choice').classList.add('show')}
function showMission(){stopAuto();hideAll();mode='mission';const e=episodes[ep],m=e.mission;$('missionType').textContent=`${e.type} · ${e.label}`;$('missionTitle').textContent=m.title;$('missionText').textContent=m.text;$('mission').classList.add('show')}
function startBattle(){hideAll();mode='battle';battleStep=0;const e=episodes[ep],m=e.mission;$('objective').textContent=m.objective;$('condition').textContent=m.condition;$('battle').classList.add('show');battleDraw()}
function battleDraw(){const e=episodes[ep],c=e.combat[Math.min(battleStep,e.combat.length-1)],ratio=c[2];$('wave').textContent=`${Math.min(battleStep+1,2)} / 2`;$('hp').style.width=ratio+'%';$('comName').textContent=c[0];$('comLine').textContent=c[1];$('comPortrait').src=c[0]==='엘리즈'?A+'char/elise-v12.png':A+'char/mireille-v12.png';$('action').textContent=ratio===0?'전투 종료':'향 공격 실행';logs.push({who:c[0],text:c[1]})}
function battleAdvance(){const e=episodes[ep];$('enemy').classList.remove('hit');void $('enemy').offsetWidth;$('enemy').classList.add('hit');if(battleStep<e.combat.length-1){battleStep++;battleDraw();return}if(e.post){idx=0;mode='post';renderPost()}else showResult()}
function renderPost(){const e=episodes[ep];if(idx<e.post.length){say(e.post[idx++]);mode='post'}else showResult()}
function showResult(){hideAll();mode='result';const r=episodes[ep].result;$('resultTitle').textContent=r.title;$('resultText').textContent=r.text;$('result').classList.add('show')}
function finishEpisode(title,text){hideAll();mode='result';$('resultTitle').textContent=title;$('resultText').textContent=text;$('result').classList.add('show')}
function render(){const e=episodes[ep];setHeader();setBg(e.bg);if(e.type==='B'){showMission();return}const list=e.steps||e.pre||[];if(idx>=list.length){if(e.mission){showMission()}else finishEpisode(`${e.n}화 완료`,e.title);return}const s=list[idx];if(s.k==='bg'){setBg(s.src);idx++;render();return}if(s.k==='say'){say(s);return}if(s.k==='choice'){showChoice(s);return}if(s.k==='end'){finishEpisode(s.title,s.text)}}
function advance(){if(mode==='story'){idx++;if(episodes[ep].post&&mode==='post')renderPost();else if(episodes[ep].post&&idx<=episodes[ep].post.length&&episodes[ep].type==='SB'&&battleStep>=episodes[ep].combat.length-1)renderPost();else render()}else if(mode==='post')renderPost()}
function nextEpisode(){stopAuto();if(ep<episodes.length-1){ep++;idx=0;mode='story';render()}else{ep=0;idx=0;render()}}
function stopAuto(){if(auto){clearInterval(auto);auto=null}$('autoBtn').classList.remove('on')}
function toggleAuto(){if(auto){stopAuto();return}$('autoBtn').classList.add('on');auto=setInterval(()=>{if(mode==='story')advance();else stopAuto()},2800)}
function skip(){stopAuto();const e=episodes[ep];if(e.type==='S'){const end=e.steps.find(x=>x.k==='end');finishEpisode(end?.title||`${e.n}화 완료`,end?.text||e.title)}else if(mode==='battle'||mode==='mission'){showResult()}else showMission()}
function openLog(){stopAuto();$('logList').innerHTML=logs.length?logs.map(x=>`<div class="log-row"><b>${x.who}</b><span>${x.text}</span></div>`).join(''):'<p>아직 기록된 대사가 없습니다.</p>';$('log').classList.add('show')}
$('story').onclick=()=>{if(mode==='post')renderPost();else advance()};$('missionStart').onclick=startBattle;$('action').onclick=battleAdvance;$('resultNext').onclick=nextEpisode;$('autoBtn').onclick=toggleAuto;$('skipBtn').onclick=skip;$('logBtn').onclick=openLog;$('logClose').onclick=()=>$('log').classList.remove('show');$('log').onclick=e=>{if(e.target===$('log'))$('log').classList.remove('show')};
episodes.forEach((e,k)=>{const b=document.createElement('button');b.textContent=e.n;b.title=`${e.n}화 ${e.title}`;b.onclick=()=>{stopAuto();ep=k;idx=0;mode='story';render()};$('episodeMap').appendChild(b)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('log').classList.remove('show');if((e.key===' '||e.key==='ArrowRight')&&mode==='story')advance()});addEventListener('resize',fit);fit();render();
</script></body></html>
